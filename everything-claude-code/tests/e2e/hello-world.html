<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Hello World</title>
  <style>
    body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding: 4rem; }
    button { padding: 0.75rem 2rem; font-size: 1rem; cursor: pointer; }
    #output { margin-top: 1.5rem; font-size: 1.5rem; min-height: 2rem; color: #1a1a1a; }
  </style>
</head>
<body>
  <button id="btn">Click me</button>
  <div id="output"></div>
  <script>
    document.getElementById('btn').addEventListener('click', function () {
      document.getElementById('output').textContent = 'Hello World';
    });
  </script>
</body>
</html>
